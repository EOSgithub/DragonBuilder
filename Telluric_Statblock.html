<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telluric Dragon — Stat Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="codex.css">
</head>
<body data-dragon="telluric" data-page="statblock">

<main class="shell">

  <nav class="topnav">
    <a href="index.html" class="btn btn--ghost"><span class="arrow" style="transform:rotate(180deg)">→</span> Codex</a>
    <a href="Telluric_Skill_Tree.html" class="btn btn--ghost">Skill Tree <span class="arrow">→</span></a>
  </nav>

  <header class="plate-head reveal r1">
    <span class="sigil" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M6 37 L24 9 L42 37"/>
        <path d="M15 37 L24 23 L33 37"/>
        <line x1="4" y1="42" x2="44" y2="42" opacity=".5"/>
        <line x1="10" y1="37" x2="38" y2="37" opacity=".3"/>
      </svg>
    </span>
    <div class="binom">Draco telluricus</div>
    <h1>Telluric Dragon</h1>
    <div class="stage-line" id="stageLine">⛰️ Telluric Wyrmling</div>
  </header>

  <div class="plate-mastery reveal r2">
    <span class="count" id="masteryCount">0 / 21 Mastery</span>
    <div class="spec-track"><div class="spec-track-fill" id="masteryFill"></div></div>
  </div>

  <article class="plate reveal r2">
    <div class="plate-rule"></div>
    <div class="plate-inner" id="sbInner"></div>
    <div class="plate-rule"></div>
  </article>

  <p class="sb-locked-hint reveal r3">Unlock mastery in the Skill Tree to empower the dragon</p>

</main>

<script>
const SAVE_KEY = 'dragon_telluric';
const TOTAL = 21;
const BASE = { STR: 16, DEX: 10, CON: 14, INT: 10, WIS: 12, CHA: 8 };
const PROF = 3;

const STAGES = [
  { name: 'Wyrmling', size: 'Tiny',  hpMult: 10, eyebrow: '⛰️ Telluric Wyrmling' },
  { name: 'Whelp',   size: 'Small',  hpMult: 15, eyebrow: '⛰️ Telluric Whelp'    },
  { name: 'Young',   size: 'Medium', hpMult: 20, eyebrow: '⛰️ Telluric Young'    },
  { name: 'Adult',   size: 'Large',  hpMult: 25, eyebrow: '⛰️ Telluric Adult'    },
];
function getStageIdx(n) { if (n >= 20) return 3; if (n >= 10) return 2; if (n >= 5) return 1; return 0; }

const STAT_BONUSES = {
  p1s1: { stat: 'CON', bonus: 1 }, p1s2: { stat: 'CON', bonus: 1 }, p1s3: { stat: 'CON', bonus: 2 },
  p2s1: { stat: 'STR', bonus: 1 }, p2s2: { stat: 'STR', bonus: 1 }, p2s3: { stat: 'STR', bonus: 2 },
  p3s1: { stat: 'DEX', bonus: 1 }, p3s2: { stat: 'DEX', bonus: 1 }, p3s3: { stat: 'DEX', bonus: 2 },
};

function getUnlocked() {
  try { const s = localStorage.getItem(SAVE_KEY); return new Set(s ? JSON.parse(s) : []); }
  catch(e) { return new Set(); }
}
function mod(v) { return Math.floor((v - 10) / 2); }
function modStr(v) { const m = mod(v); return (m >= 0 ? '+' : '') + m; }
function signed(n) { return (n >= 0 ? '+' : '') + n; }

function computeStats(unlocked) {
  const stats = { ...BASE };
  for (const [id, nb] of Object.entries(STAT_BONUSES)) if (unlocked.has(id)) stats[nb.stat] += nb.bonus;
  return stats;
}

function render() {
  const unlocked = getUnlocked();
  const stats = computeStats(unlocked);
  const count = unlocked.size;

  document.getElementById('masteryCount').textContent = count + ' / ' + TOTAL + ' Mastery';
  document.getElementById('masteryFill').style.width = (count / TOTAL * 100) + '%';

  const conMod = mod(stats.CON), dexMod = mod(stats.DEX), strMod = mod(stats.STR), wisMod = mod(stats.WIS);
  const stageIdx = getStageIdx(count);
  const stage = STAGES[stageIdx];
  const hp = conMod * stage.hpMult + 11 * 2;
  document.getElementById('stageLine').textContent = stage.eyebrow;

  const breathDC = 8 + PROF + conMod;
  const tailDC = 8 + PROF + strMod;

  let ac = 13 + dexMod;
  if (unlocked.has('p3n1')) ac += 1;
  if (unlocked.has('p3cap')) ac += 2;

  let breathRecharge = '1/Short Rest';
  if (unlocked.has('p1n1')) breathRecharge = 'Recharge 6';

  const speeds = '20 ft., burrow 40 ft.';
  const biteHit = signed(strMod + PROF);

  const resistances = ['bludgeoning'];
  if (unlocked.has('p3n1')) { resistances.length = 0; resistances.push('bludgeoning, piercing, and slashing'); }

  let html = `
    <div class="sb-name">Telluric Dragon ${stage.name}</div>
    <div class="sb-type"><em>${stage.size} Dragon</em></div>
    <div class="sb-divider"></div>
    <div class="sb-basics">
      <p><span class="sb-label">Armor Class</span> ${ac} (13 + DEX mod.)</p>
      <p><span class="sb-label">Hit Points</span> ${hp} (${stage.hpMult} × CON mod. + Level × 2)</p>
      <p><span class="sb-label">Speed</span> ${speeds}</p>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-scores">`;

  for (const k of ['STR','DEX','CON','INT','WIS','CHA']) {
    html += `<div class="sb-score-cell"><div class="sb-score-k">${k}</div><div class="sb-score-v">${stats[k]}</div><div class="sb-score-m">${modStr(stats[k])}</div></div>`;
  }
  html += `</div><div class="sb-divider"></div>`;
  html += `<p class="sb-prop"><span class="sb-label">Saving Throws</span> Str ${signed(strMod + PROF)}, Con ${signed(conMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Skills</span> Perception ${signed(wisMod + PROF)}, Athletics ${signed(strMod + PROF)}</p>`;
  if (resistances.length) html += `<p class="sb-prop"><span class="sb-label">Damage Resistances</span> ${resistances.join('; ')}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Senses</span> Darkvision 30 ft., Passive Perception ${10 + wisMod + PROF}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Languages</span> Draconic</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Proficiency Bonus</span> +${PROF}</p>`;
  html += `<div class="sb-divider"></div>`;

  // Traits
  html += `<div class="sb-ability"><span class="sb-ability-name">Stone Bulwark.</span>
    <p>The dragon has <b>resistance to bludgeoning damage</b>, has <b>advantage</b> on saving throws and ability checks against effects that would move it against its will, and the area within <b>5 ft.</b> of the dragon is considered <b>difficult terrain</b> for hostile creatures.</p></div>`;

  if (stageIdx >= 1) {
    const regen = [0, 5, 10, 20][stageIdx];
    let shText = `At the start of each of its turns, the dragon regains <b>${regen} HP</b> as living stone seals its wounds.`;
    if (stageIdx >= 2) shText += ` The dragon is <b>immune to the petrified and charmed conditions</b>.`;
    if (stageIdx >= 3) shText += ` Once per long rest, when reduced to 0 HP, the dragon instead drops to <b>1 HP</b> — a shell of indestructible stone briefly encases its vital organs, shattering harmlessly at the start of its next turn.`;
    html += `<div class="sb-ability"><span class="sb-ability-name">Stone Heart <span class="tag">(${stage.name}).</span></span><p>${shText}</p></div>`;
  }

  if (unlocked.has('p3n1')) html += `<div class="sb-ability"><span class="sb-ability-name">Crystal Scales.</span>
    <p>Gemstones protrude from the dragon's hide. It gains <b>resistance to bludgeoning, piercing, and slashing damage</b>, and its AC increases by <b>+1</b> (already applied above).</p></div>`;

  if (unlocked.has('p3n2')) html += `<div class="sb-ability"><span class="sb-ability-name">Refractive Hide.</span>
    <p>The dragon has <b>advantage</b> on saving throws against spells and magical effects. The first spell that targets it each round has a <b>25% chance</b> to be reflected back at the caster (roll 1d4; on a 1, the spell is redirected).</p></div>`;

  if (unlocked.has('p2n3')) html += `<div class="sb-ability"><span class="sb-ability-name">Subterranean Ambush.</span>
    <p>When the dragon emerges from a burrow within <b>10 ft. of a creature</b>, that creature must make a <b>DEX save (DC ${tailDC})</b> or take <b>4d6 bludgeoning damage</b> and be knocked <b>prone</b>. The dragon also has <b>advantage</b> on its first attack roll this turn.</p></div>`;

  if (unlocked.has('p3cap')) html += `<div class="sb-ability"><span class="sb-ability-name">Adamant Carapace.</span>
    <p>The dragon's AC increases by an additional <b>+2</b>. The dragon is <b>immune to critical hits</b>. All damage the dragon deals to <b>structures</b> is maximized. The dragon takes <b>5 less damage</b> from all sources.</p></div>`;

  html += `<div class="sb-divider"></div><div class="sb-section-title">Actions</div>`;

  if (unlocked.has('p2n1')) html += `<div class="sb-ability"><span class="sb-ability-name">Multiattack.</span>
    <p>The dragon makes <b>two Rolling Charge attacks</b>, or <b>one Rolling Charge and one Bone Mace Tail</b> attack.</p></div>`;

  html += `<div class="sb-ability"><span class="sb-ability-name">Rolling Charge. <span class="tag">Melee Weapon Attack:</span></span>
    <p>${biteHit} to hit, reach 5 ft., one target. <b>Hit:</b> ${strMod} bludgeoning. If the target is <b>Medium or smaller</b>, it is pushed <b>10 ft.</b> away from the dragon and knocked <b>prone</b>.</p></div>`;

  if (unlocked.has('p2n2') && !unlocked.has('p2cap')) {
    const tailDmg = '2d8' + (strMod >= 0 ? '+' : '') + strMod + ' bludgeoning';
    html += `<div class="sb-ability"><span class="sb-ability-name">Bone Mace Tail. <span class="tag">Melee Weapon Attack:</span></span>
      <p>${biteHit} to hit, reach 10 ft., one target. <b>Hit:</b> ${tailDmg}. The target must succeed on a <b>STR save (DC ${tailDC})</b> or be <b>dazed</b> until the end of its next turn (can move or take an action, not both; no reactions).</p></div>`;
  }

  if (unlocked.has('p2cap')) {
    const tailDmg = '4d8' + (strMod >= 0 ? '+' : '') + strMod + ' bludgeoning';
    html += `<div class="sb-ability"><span class="sb-ability-name">Earthshaker Strike.</span>
      <p>The dragon's tail crashes down in a <b>15 ft. cone behind it</b>. Each creature in the area must make a <b>STR save (DC ${tailDC})</b>. On a failure: <b>${tailDmg}</b>, <b>dazed</b> until end of next turn, and knocked <b>prone</b>. On a success, half damage only.</p></div>`;
  }

  let dustVeilArea = 'the dragon\'s occupied space';
  if (unlocked.has('p1n2')) dustVeilArea = 'a <b>15 ft. radius</b> around the dragon';
  let dustVeilExtras = '';
  if (unlocked.has('p1n1')) {
    dustVeilExtras += ` <b>Choking Grit.</b> Creatures that start their turn inside the veil must make a <b>CON save (DC ${breathDC})</b> or be <b>poisoned</b> until the start of their next turn.`;
    if (unlocked.has('p1n2')) dustVeilExtras += ` Creatures that fail this save are also <b>deafened</b> until the end of their next turn.`;
  }
  if (unlocked.has('p1n3')) dustVeilExtras += ` <b>Abrasive Torrent.</b> Creatures that move through the veil take <b>2d6 slashing damage</b> per 5 ft. of movement inside it. Creatures that start their turn within the veil take <b>2d6 slashing</b> automatically. The veil's area is <b>difficult terrain</b>.`;

  html += `<div class="sb-ability"><span class="sb-ability-name">Dust Veil <span class="tag">(${breathRecharge}, Concentration, 1 min).</span></span>
    <p>The dragon exhales a roiling cloud of grit and stone-dust that fills ${dustVeilArea}, <b>heavily obscuring</b> vision within it. The cloud persists for up to 1 minute (concentration) and moves with the dragon.${dustVeilExtras}</p></div>`;

  if (unlocked.has('p1cap')) html += `<div class="sb-ability"><span class="sb-ability-name">Petrifying Exhalation <span class="tag">(1/Long Rest).</span></span>
    <p>The dragon releases a concentrated pulse of mineralizing dust from the Dust Veil. All creatures currently inside the veil must make a <b>CON save (DC ${breathDC})</b>. On a failure they are <b>restrained</b> as their joints begin to calcify (repeat the save at the end of each of their turns to end the effect). On a <b>natural 1</b> they are instead <b>petrified</b> for 1 hour. The Dust Veil dissipates immediately after this exhalation.</p></div>`;

  if (unlocked.has('p3n3')) {
    html += `<div class="sb-section-title">Reactions</div>`;
    html += `<div class="sb-ability"><span class="sb-ability-name">Plate Shed.</span>
      <p>When the dragon takes damage, it can shed its outer layer of stone plating, hurling the shards at the attacker. The attacker takes <b>${ac} bludgeoning damage</b>. The dragon's AC is then <b>reduced to 13</b> for 1 minute as the plates begin to regrow.</p></div>`;
  }

  document.getElementById('sbInner').innerHTML = html;
}

// ── GITHUB AUTO-LOAD ─────────────────────────────────────────────────────────
const GH_SAVE_PATH = 'saves/' + SAVE_KEY + '.json';
function getGHConfig() {
  return { owner: localStorage.getItem('gh_owner') || '', repo: localStorage.getItem('gh_repo') || '', token: localStorage.getItem('gh_token') || '' };
}
function ghConfigured() { const c = getGHConfig(); return !!(c.owner && c.repo && c.token); }
async function loadFromGitHub() {
  if (!ghConfigured()) return;
  const { owner, repo, token } = getGHConfig();
  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GH_SAVE_PATH}`,
      { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } });
    if (!res.ok) return;
    const data = await res.json();
    const parsed = JSON.parse(atob(data.content.replace(/\s/g, '')));
    localStorage.setItem(SAVE_KEY, JSON.stringify(parsed.unlocked || []));
    render();
  } catch(e) {}
}

render();
loadFromGitHub();
window.addEventListener('pageshow', e => { if (e.persisted) render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
</script>
</body>
</html>

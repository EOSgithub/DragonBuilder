<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erosion Dragon — Stat Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="codex.css">
</head>
<body data-dragon="erosion" data-page="statblock">

<main class="shell">

  <nav class="topnav">
    <a href="index.html" class="btn btn--ghost"><span class="arrow" style="transform:rotate(180deg)">→</span> Codex</a>
    <a href="Erosion_Skill_Tree.html" class="btn btn--ghost">Skill Tree <span class="arrow">→</span></a>
  </nav>

  <header class="plate-head reveal r1">
    <span class="sigil" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M14 8 H34 L24 24 L34 40 H14 L24 24 Z"/>
        <line x1="24" y1="24" x2="24" y2="34" stroke-dasharray="1 3"/>
        <circle cx="24" cy="38" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <div class="binom">Draco senescens</div>
    <h1>Erosion Dragon</h1>
    <div class="stage-line" id="stageLine">⏳ Erosion Wyrmling</div>
  </header>

  <div class="plate-mastery reveal r2">
    <span class="count" id="masteryCount">0 / 21 Mastery</span>
    <div class="spec-track"><div class="spec-track-fill" id="masteryFill"></div></div>
  </div>

  <article class="plate reveal r2">
    <div class="plate-rule"></div>
    <div class="plate-inner" id="sbInner"></div>
    <div class="plate-rule"></div>
  </article>

  <p class="sb-locked-hint reveal r3">Unlock mastery in the Skill Tree to empower the dragon</p>

</main>

<script>
const SAVE_KEY = 'dragon_erosion';
const TOTAL = 21;
const BASE = { STR: 14, DEX: 10, CON: 16, INT: 10, WIS: 12, CHA: 10 };
const PROF = 3;

const STAGES = [
  { name: 'Wyrmling', size: 'Tiny',  hpMult: 10, eyebrow: '⏳ Erosion Wyrmling' },
  { name: 'Whelp',   size: 'Small',  hpMult: 15, eyebrow: '⏳ Erosion Whelp'    },
  { name: 'Young',   size: 'Medium', hpMult: 20, eyebrow: '⏳ Erosion Young'    },
  { name: 'Adult',   size: 'Large',  hpMult: 25, eyebrow: '⏳ Erosion Adult'    },
];
function getStageIdx(n) { if (n >= 20) return 3; if (n >= 10) return 2; if (n >= 5) return 1; return 0; }

const STAT_BONUSES = {
  p1s1: { stat: 'CON', bonus: 1 }, p1s2: { stat: 'CON', bonus: 1 }, p1s3: { stat: 'CON', bonus: 2 },
  p2s1: { stat: 'DEX', bonus: 1 }, p2s2: { stat: 'DEX', bonus: 1 }, p2s3: { stat: 'DEX', bonus: 2 },
  p3s1: { stat: 'WIS', bonus: 1 }, p3s2: { stat: 'WIS', bonus: 1 }, p3s3: { stat: 'WIS', bonus: 2 },
};

function getUnlocked() {
  try { const s = localStorage.getItem(SAVE_KEY); return new Set(s ? JSON.parse(s) : []); }
  catch(e) { return new Set(); }
}
function mod(v) { return Math.floor((v - 10) / 2); }
function modStr(v) { const m = mod(v); return (m >= 0 ? '+' : '') + m; }
function signed(n) { return (n >= 0 ? '+' : '') + n; }

function computeStats(unlocked) {
  const stats = { ...BASE };
  for (const [id, nb] of Object.entries(STAT_BONUSES)) if (unlocked.has(id)) stats[nb.stat] += nb.bonus;
  return stats;
}

function render() {
  const unlocked = getUnlocked();
  const stats = computeStats(unlocked);
  const count = unlocked.size;

  document.getElementById('masteryCount').textContent = count + ' / ' + TOTAL + ' Mastery';
  document.getElementById('masteryFill').style.width = (count / TOTAL * 100) + '%';

  const conMod = mod(stats.CON), dexMod = mod(stats.DEX), strMod = mod(stats.STR), wisMod = mod(stats.WIS);
  const stageIdx = getStageIdx(count);
  const stage = STAGES[stageIdx];
  const hp = conMod * stage.hpMult + 13 * 2;
  document.getElementById('stageLine').textContent = stage.eyebrow;

  const ac = 13 + dexMod;
  const faultHit = signed(strMod + PROF);
  const faultDmg = strMod > 0 ? `1d4+${strMod} piercing` : strMod < 0 ? `1d4${strMod} piercing` : '1d4 piercing';

  let html = `
    <div class="sb-name">Erosion Dragon ${stage.name}</div>
    <div class="sb-type"><em>${stage.size} Dragon, Neutral</em></div>
    <div class="sb-divider"></div>
    <div class="sb-basics">
      <p><span class="sb-label">Armor Class</span> ${ac} (13 + DEX mod.)</p>
      <p><span class="sb-label">Hit Points</span> ${hp} (${stage.hpMult} × CON mod. + Level × 2)</p>
      <p><span class="sb-label">Speed</span> 20 ft., fly 20 ft.</p>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-scores">`;

  for (const k of ['STR','DEX','CON','INT','WIS','CHA']) {
    html += `<div class="sb-score-cell"><div class="sb-score-k">${k}</div><div class="sb-score-v">${stats[k]}</div><div class="sb-score-m">${modStr(stats[k])}</div></div>`;
  }
  html += `</div><div class="sb-divider"></div>`;
  html += `<p class="sb-prop"><span class="sb-label">Saving Throws</span> Dex ${signed(dexMod + PROF)}, Con ${signed(conMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Skills</span> Perception ${signed(wisMod + PROF)}, Stealth ${signed(dexMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Senses</span> Darkvision 60 ft., Passive Perception ${10 + wisMod + PROF}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Languages</span> Draconic</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Challenge</span> — &nbsp;·&nbsp; <span class="sb-label">Proficiency Bonus</span> +${PROF}</p>`;
  html += `<div class="sb-divider"></div>`;

  html += `<div class="sb-section-title">Passive Ability</div>`;
  html += `<div class="sb-ability"><span class="sb-ability-name">Attrition.</span>
    <p>Each time the dragon damages a creature with a melee attack, it applies one <b>[Erosion]</b> stack to that creature.</p></div>`;

  html += `<div class="sb-divider"></div><div class="sb-section-title">Actions</div>`;

  html += `<div class="sb-ability"><span class="sb-ability-name">Fault Line. <span class="tag">Melee Weapon Attack:</span></span>
    <p>${faultHit} to hit, reach 5 ft., one target. <b>Hit:</b> ${faultDmg}. On a hit, the target <b>loses resistance to one damage type</b> of the dragon's choice until the start of the target's next turn. If the target has no relevant resistances, it has <b>disadvantage on its next CON saving throw</b> instead.</p></div>`;

  html += `<div class="sb-ability"><span class="sb-ability-name">Erosion Cloud. <span class="tag">Breath Weapon (1/Short Rest, Concentration, 1 minute).</span></span>
    <p>A <b>10 ft. radius</b> cloud of erosive force fills the area around the dragon and moves with it. Creatures that <b>enter the cloud</b> must succeed on a <b>DC 13 CON save</b> or gain <b>1 [Erosion]</b> stack. Creatures with <b>3 or more [Erosion]</b> stacks also have <b>disadvantage on CON saving throws</b> for as long as they remain inside the cloud.</p></div>`;

  html += `<div class="sb-divider-thin"></div>`;
  html += `<div class="sb-mechanic">
    <div class="sb-mechanic-name">[Erosion]</div>
    <p>A creature can have a maximum of <b>4</b> [Erosion] stacks. For every <b>2 stacks</b>, it suffers a <b>−1 penalty to AC</b>. <b>One stack</b> is removed at the end of each of its turns.</p></div>`;

  document.getElementById('sbInner').innerHTML = html;
}

// ── GITHUB AUTO-LOAD ─────────────────────────────────────────────────────────
const GH_SAVE_PATH = 'saves/' + SAVE_KEY + '.json';
function getGHConfig() {
  return { owner: localStorage.getItem('gh_owner') || '', repo: localStorage.getItem('gh_repo') || '', token: localStorage.getItem('gh_token') || '' };
}
function ghConfigured() { const c = getGHConfig(); return !!(c.owner && c.repo && c.token); }
async function loadFromGitHub() {
  if (!ghConfigured()) return;
  const { owner, repo, token } = getGHConfig();
  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GH_SAVE_PATH}`,
      { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } });
    if (!res.ok) return;
    const data = await res.json();
    const parsed = JSON.parse(atob(data.content.replace(/\s/g, '')));
    localStorage.setItem(SAVE_KEY, JSON.stringify(parsed.unlocked || []));
    render();
  } catch(e) {}
}

render();
loadFromGitHub();
window.addEventListener('pageshow', e => { if (e.persisted) render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Erosion Dragon — Stat Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="codex.css">
<script src="codex.js"></script>
</head>
<body data-dragon="erosion" data-page="statblock">

<main class="shell">

  <nav class="topnav">
    <a href="index.html" class="btn btn--ghost"><span class="arrow" style="transform:rotate(180deg)">→</span> Codex</a>
    <a href="Erosion_Skill_Tree.html" class="btn btn--ghost">Skill Tree <span class="arrow">→</span></a>
  </nav>

  <header class="plate-head reveal r1">
    <span class="sigil" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M14 8 H34 L24 24 L34 40 H14 L24 24 Z"/>
        <line x1="24" y1="24" x2="24" y2="34" stroke-dasharray="1 3"/>
        <circle cx="24" cy="38" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <div class="binom">Draco senescens</div>
    <h1>Erosion Dragon</h1>
    <div class="stage-line" id="stageLine">⏳ Erosion Wyrmling</div>
  </header>

  <div class="plate-mastery reveal r2">
    <span class="count" id="masteryCount">0 / 21 Mastery</span>
    <div class="spec-track"><div class="spec-track-fill" id="masteryFill"></div></div>
  </div>

  <article class="plate reveal r2">
    <div class="plate-rule"></div>
    <div class="plate-inner" id="sbInner"></div>
    <div class="plate-rule"></div>
  </article>

  <p class="sb-locked-hint reveal r3">Tocca un&rsquo;abilit&agrave; per tirarne i dadi &middot; Sblocca mastery nello Skill Tree per potenziare il drago</p>

</main>

<script>
const SAVE_KEY = 'dragon_erosion';
const TOTAL = 21;
const BASE = { STR: 14, DEX: 10, CON: 16, INT: 10, WIS: 12, CHA: 10 };
// Proficiency bonus by size/stage: Tiny 2, Small 3, Medium 3, Large 4, larger 5
const PROF_BY_STAGE = [2, 3, 3, 4, 5];
// HP tracks the bonded Oathsworn's character level. Final: 14.
const OATHSWORN_LEVEL = 14;

const STAGES = [
  { name: 'Wyrmling', size: 'Tiny',  hpMult: 10, eyebrow: '⏳ Erosion Wyrmling' },
  { name: 'Whelp',   size: 'Small',  hpMult: 15, eyebrow: '⏳ Erosion Whelp'    },
  { name: 'Young',   size: 'Medium', hpMult: 20, eyebrow: '⏳ Erosion Young'    },
  { name: 'Adult',   size: 'Large',  hpMult: 25, eyebrow: '⏳ Erosion Adult'    },
];
function getStageIdx(n) { if (n >= 20) return 3; if (n >= 10) return 2; if (n >= 5) return 1; return 0; }

const STAT_BONUSES = {
  p1s1: { stat: 'CON', bonus: 1 }, p1s2: { stat: 'CON', bonus: 1 }, p1s3: { stat: 'CON', bonus: 2 },
  p2s1: { stat: 'STR', bonus: 1 }, p2s2: { stat: 'STR', bonus: 1 }, p2s3: { stat: 'STR', bonus: 2 },
  p3s1: { stat: 'WIS', bonus: 1 }, p3s2: { stat: 'WIS', bonus: 1 }, p3s3: { stat: 'WIS', bonus: 2 },
};

function getUnlocked() {
  try { const s = localStorage.getItem(SAVE_KEY); return new Set(s ? JSON.parse(s) : []); }
  catch(e) { return new Set(); }
}
function mod(v) { return Math.floor((v - 10) / 2); }
function modStr(v) { const m = mod(v); return (m >= 0 ? '+' : '') + m; }
function signed(n) { return (n >= 0 ? '+' : '') + n; }
// Damage expression: the modifier is omitted entirely when it is 0, so we never
// print "2d6+0". Kept ASCII-signed so codex.js can parse and roll it.
function dmgStr(dice, m, type) { return dice + (m > 0 ? '+' + m : m < 0 ? '-' + Math.abs(m) : '') + ' ' + type; }

function computeStats(unlocked) {
  const stats = { ...BASE };
  for (const [id, nb] of Object.entries(STAT_BONUSES)) if (unlocked.has(id)) stats[nb.stat] += nb.bonus;
  return stats;
}

function render() {
  const unlocked = getUnlocked();
  const stats = computeStats(unlocked);
  const count = unlocked.size;

  document.getElementById('masteryCount').textContent = count + ' / ' + TOTAL + ' Mastery';
  document.getElementById('masteryFill').style.width = (count / TOTAL * 100) + '%';

  const conMod = mod(stats.CON), dexMod = mod(stats.DEX), strMod = mod(stats.STR), wisMod = mod(stats.WIS);
  const stageIdx = getStageIdx(count);
  const stage = STAGES[stageIdx];
  const PROF = PROF_BY_STAGE[stageIdx];
  const breathDC = 8 + PROF + conMod;
  const hp = conMod * stage.hpMult + OATHSWORN_LEVEL * 2;
  document.getElementById('stageLine').textContent = stage.eyebrow;

  const ac = 13 + dexMod;
  const faultHit = signed(strMod + PROF);
  const faultDmg = dmgStr('1d4', strMod, 'piercing');

  // ── Skill-tree-driven values (source of truth: Erosion_Skill_Tree.html) ──────
  // Erosion Cloud recharge & radius scale with the Erosion Cloud path (p1)
  let cloudRecharge = '1/Short Rest', cloudRadius = '10 ft.';
  if (unlocked.has('p1n1'))  cloudRecharge = 'Recharge 6';
  if (unlocked.has('p1n2'))  cloudRecharge = 'Recharge 5–6';
  if (unlocked.has('p1n3'))  { cloudRecharge = 'Recharge 4–6'; cloudRadius = '15 ft.'; }
  if (unlocked.has('p1cap')) { cloudRecharge = 'Recharge 3–6'; cloudRadius = '20 ft.'; }
  // Fault Line resistance-strip duration (p2n2 Lingering Fractures)
  const stripDuration = unlocked.has('p2n2')
    ? "until the <b>end of the dragon's next turn</b>"
    : "until the <b>start of the target's next turn</b>";
  // [Erosion] max stacks scale with the Attrition path (p3)
  let maxStacks = 4;
  if (unlocked.has('p3n1'))  maxStacks = 5;
  if (unlocked.has('p3n2'))  maxStacks = 6;
  if (unlocked.has('p3n3'))  maxStacks = 7;
  if (unlocked.has('p3cap')) maxStacks = 8;

  let html = `
    <div class="sb-name">Erosion Dragon ${stage.name}</div>
    <div class="sb-type"><em>${stage.size} Dragon, Neutral</em></div>
    <div class="sb-divider"></div>
    <div class="sb-basics">
      <p><span class="sb-label">Armor Class</span> ${ac} (13 + DEX mod.)</p>
      <p><span class="sb-label">Hit Points</span> ${hp} (${stage.hpMult} × CON mod. + Level ${OATHSWORN_LEVEL} × 2)</p>
      <p><span class="sb-label">Speed</span> 20 ft., fly 20 ft.</p>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-scores">`;

  for (const k of ['STR','DEX','CON','INT','WIS','CHA']) {
    html += `<div class="sb-score-cell"><div class="sb-score-k">${k}</div><div class="sb-score-v">${stats[k]}</div><div class="sb-score-m">${modStr(stats[k])}</div></div>`;
  }
  html += `</div><div class="sb-divider"></div>`;
  html += `<p class="sb-prop"><span class="sb-label">Saving Throws</span> Dex ${signed(dexMod + PROF)}, Con ${signed(conMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Skills</span> Perception ${signed(wisMod + PROF)}, Stealth ${signed(dexMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Senses</span> Darkvision 60 ft., Passive Perception ${10 + wisMod + PROF}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Languages</span> Draconic</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Challenge</span> — &nbsp;·&nbsp; <span class="sb-label">Proficiency Bonus</span> +${PROF}</p>`;
  html += `<div class="sb-divider"></div>`;

  html += `<div class="sb-section-title">Passive Abilities</div>`;
  html += `<div class="sb-ability"><span class="sb-ability-name">Attrition.</span>
    <p>Each time the dragon damages a creature with a melee attack, it applies one <b>[Erosion]</b> stack to that creature.</p></div>`;

  if (unlocked.has('p2n3')) html += `<div class="sb-ability"><span class="sb-ability-name">Rending Bite.</span>
    <p>On a hit with <b>Fault Line</b>, the dragon may strip <b>two</b> damage-type resistances instead of one. If the target has only one relevant resistance, the second choice applies the <b>CON disadvantage</b> fallback as normal.</p></div>`;

  if (unlocked.has('p3cap')) html += `<div class="sb-ability"><span class="sb-ability-name">Inevitable Decay.</span>
    <p>Choose one ability when this is unlocked: <b>WIS, INT, or CHA</b>. A creature with any [Erosion] stacks applies its <b>AC penalty</b> from [Erosion] to <b>saving throws of the chosen type</b> as well.</p></div>`;

  html += `<div class="sb-divider"></div><div class="sb-section-title">Actions</div>`;

  if (unlocked.has('p2n1')) html += `<div class="sb-ability"><span class="sb-ability-name">Multiattack.</span>
    <p>The dragon makes <b>two Fault Line attacks</b>.</p></div>`;

  html += `<div class="sb-ability"><span class="sb-ability-name">Fault Line. <span class="tag">Melee Weapon Attack:</span></span>
    <p>${faultHit} to hit, reach 5 ft., one target. <b>Hit:</b> ${faultDmg}. On a hit, the target <b>loses resistance to one damage type</b> of the dragon's choice ${stripDuration}. If the target has no relevant resistances, it has <b>disadvantage on its next CON saving throw</b> instead.</p></div>`;

  // Erosion Cloud (base) + path modifications
  let cloudExtra = '';
  if (unlocked.has('p1n1')) cloudExtra += ` Instead of an emanation, the cloud can be placed as a <b>fixed 10 ft. radius sphere</b> in any space within <b>30 ft.</b> of the dragon.`;
  if (unlocked.has('p1n2')) cloudExtra += ` Creatures inside the cloud have <b>disadvantage on the CON save</b> to remove [Erosion] stacks.`;
  if (unlocked.has('p1n3')) cloudExtra += ` As a <b>bonus action</b>, the dragon can move the cloud up to <b>30 ft.</b> in any direction.`;
  const cloudTag = unlocked.has('p1cap')
    ? `${cloudRecharge}, Concentration or none (1/Long Rest), 1 minute`
    : `${cloudRecharge}, Concentration, 1 minute`;
  if (unlocked.has('p1cap')) cloudExtra += ` <b>Timeless Shroud (1/Long Rest):</b> the dragon may forgo Concentration — the cloud persists for its <b>full 1-minute duration on its own</b>, with no concentration checks.`;
  html += `<div class="sb-ability"><span class="sb-ability-name">Erosion Cloud. <span class="tag">Breath Weapon (${cloudTag}).</span></span>
    <p>A <b>${cloudRadius} radius</b> cloud of erosive force fills the area around the dragon and moves with it. Creatures that <b>enter the cloud</b> must succeed on a <b>DC ${breathDC} CON save</b> or gain <b>1 [Erosion]</b> stack. Creatures with <b>3 or more [Erosion]</b> stacks also have <b>disadvantage on CON saving throws</b> for as long as they remain inside the cloud.${cloudExtra}</p></div>`;

  if (unlocked.has('p2cap')) html += `<div class="sb-ability"><span class="sb-ability-name">Geological Memory <span class="tag">(1/Short Rest).</span></span>
    <p>The dragon makes a single <b>Fault Line</b> attack. On a hit, it deals normal damage plus <b>+2d8 per resistance stripped this combat</b>. The target must then succeed on a <b>DC 13 CON save</b> or every resistance stripped from it <b>remains stripped until it completes a long rest</b>.</p></div>`;

  // [Erosion] mechanic — max stacks and removal rules scale with the Attrition path
  let erosionRules = `A creature can have a maximum of <b>${maxStacks}</b> [Erosion] stacks. For every <b>2 stacks</b>, it suffers a <b>−1 penalty to AC</b>.`;
  if (unlocked.has('p3n1')) {
    erosionRules += ` Stacks no longer fall off automatically: at the end of its turn, a creature removes one stack only on a successful <b>DC 13 CON save</b>.`;
  } else {
    erosionRules += ` <b>One stack</b> is removed at the end of each of its turns.`;
  }
  if (unlocked.has('p3n2')) erosionRules += ` A creature with <b>4 or more</b> stacks has its <b>speed reduced by 10 ft.</b>`;
  if (unlocked.has('p3n3')) erosionRules += ` A creature with <b>2+</b> stacks cannot take the <b>Disengage</b> action; at <b>4+</b> it also cannot <b>Dodge</b>; at <b>6+</b> it also cannot <b>Dash</b>.`;
  html += `<div class="sb-divider-thin"></div>`;
  html += `<div class="sb-mechanic">
    <div class="sb-mechanic-name">[Erosion]</div>
    <p>${erosionRules}</p></div>`;

  document.getElementById('sbInner').innerHTML = html;
  if (window.Codex) Codex.enhance();
}

// ── GITHUB AUTO-LOAD ─────────────────────────────────────────────────────────
const GH_SAVE_PATH = 'saves/' + SAVE_KEY + '.json';
function getGHConfig() {
  return { owner: localStorage.getItem('gh_owner') || '', repo: localStorage.getItem('gh_repo') || '', token: localStorage.getItem('gh_token') || '' };
}
function ghConfigured() { const c = getGHConfig(); return !!(c.owner && c.repo && c.token); }
async function loadFromGitHub() {
  if (!ghConfigured()) return;
  const { owner, repo, token } = getGHConfig();
  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GH_SAVE_PATH}`,
      { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } });
    if (!res.ok) return;
    const data = await res.json();
    const parsed = JSON.parse(atob(data.content.replace(/\s/g, '')));
    localStorage.setItem(SAVE_KEY, JSON.stringify(parsed.unlocked || []));
    render();
  } catch(e) {}
}

render();
loadFromGitHub();
window.addEventListener('pageshow', e => { if (e.persisted) render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
</script>
</body>
</html>

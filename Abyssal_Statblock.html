<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyssal Dragon — Stat Block</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050810;
  --accent: #00c8d7;
  --divider: rgba(0,200,215,0.3);
  --text: #c8d8f0;
  --text-dim: #5a7aaa;
  --text-muted: #3a5070;
  --panel-bg: rgba(0,12,30,0.94);
  --panel-border: rgba(0,200,215,0.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 25% 40%, rgba(0,50,110,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 70%, rgba(0,20,50,0.2) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
.particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.particle { position: absolute; border-radius: 50%; animation: float linear infinite; }
@keyframes float {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  10%  { opacity: 0.8; } 90% { opacity: 0.3; }
  100% { transform: translateY(-10px) scale(1); opacity: 0; }
}
.wrapper {
  position: relative; z-index: 1;
  max-width: 680px; margin: 0 auto; padding: 40px 20px 60px;
}
.page-nav {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px; gap: 12px;
}
.nav-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); text-decoration: none;
  padding: 7px 16px; border: 1px solid rgba(0,200,215,0.12);
  border-radius: 6px; transition: all 0.3s; white-space: nowrap;
}
.nav-btn:hover { color: var(--accent); border-color: rgba(0,200,215,0.38); }
.dragon-header { text-align: center; margin-bottom: 22px; }
.dragon-header .eyebrow {
  font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 5px;
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;
}
.dragon-header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 900; color: #fff;
  text-shadow: 0 0 30px rgba(0,200,215,0.7), 0 0 60px rgba(0,200,215,0.2);
  letter-spacing: 2px; margin-bottom: 6px;
}
.dragon-header .subtitle {
  font-family: 'Cinzel', serif; font-size: 0.72rem;
  color: var(--text-dim); letter-spacing: 2px;
}
.mastery-badge {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 24px;
}
.mastery-badge .count {
  font-family: 'Cinzel', serif; font-size: 0.62rem;
  letter-spacing: 2px; color: var(--text-muted); white-space: nowrap;
}
.mastery-bar-bg {
  flex: 1; max-width: 220px; height: 3px;
  background: rgba(0,200,215,0.1); border-radius: 2px; overflow: hidden;
}
.mastery-bar-fill {
  height: 100%; background: linear-gradient(to right, var(--accent), #80e8f0);
  border-radius: 2px; box-shadow: 0 0 6px rgba(0,200,215,0.5);
  transition: width 0.5s ease;
}
.statblock {
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 40px rgba(0,200,215,0.07), 0 8px 40px rgba(0,0,0,0.5);
}
.statblock::before, .statblock::after {
  content: ''; display: block; height: 5px;
  background: linear-gradient(to right, transparent, rgba(0,200,215,0.7), rgba(0,200,215,0.4), rgba(0,200,215,0.7), transparent);
  opacity: 0.6;
}
.sb-inner { padding: 20px 26px; }
.sb-name {
  font-family: 'Cinzel Decorative', serif; font-size: 1.25rem; font-weight: 700;
  color: var(--accent); text-shadow: 0 0 14px rgba(0,200,215,0.35); margin-bottom: 2px;
}
.sb-type { font-size: 0.9rem; font-style: italic; color: var(--text-dim); margin-bottom: 12px; }
.sb-divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--divider), transparent);
  margin: 13px 0;
}
.sb-divider-thin { height: 1px; background: rgba(0,200,215,0.07); margin: 9px 0; }
.sb-basics p { font-size: 0.9rem; line-height: 1.75; }
.sb-basics p strong {
  font-family: 'Cinzel', serif; font-size: 0.72rem;
  letter-spacing: 1px; color: var(--accent);
}
.sb-scores {
  display: grid; grid-template-columns: repeat(6, 1fr);
  text-align: center; gap: 4px; margin: 14px 0;
}
.sb-score-cell { padding: 6px 2px; }
.sb-score-label {
  font-family: 'Cinzel', serif; font-size: 0.62rem;
  letter-spacing: 2px; color: var(--accent); margin-bottom: 4px;
}
.sb-score-val {
  font-family: 'Cinzel Decorative', serif; font-size: 1rem;
  font-weight: 700; color: #fff;
}
.sb-score-mod { font-size: 0.78rem; color: var(--text-dim); }
.sb-prop { font-size: 0.88rem; line-height: 1.7; }
.sb-prop strong {
  font-family: 'Cinzel', serif; font-size: 0.72rem;
  letter-spacing: 1px; color: var(--accent);
}
.sb-section-title {
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 3px;
  text-transform: uppercase; color: var(--accent);
  border-bottom: 1px solid rgba(0,200,215,0.2);
  padding-bottom: 6px; margin-bottom: 12px; margin-top: 14px;
}
.sb-ability { margin-bottom: 10px; }
.sb-ability-name {
  font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 600;
  font-style: italic; color: var(--text);
}
.sb-ability-name .tag {
  font-style: normal; font-size: 0.7rem;
  color: var(--text-dim); margin-left: 2px;
}
.sb-ability p { font-size: 0.87rem; line-height: 1.55; color: #8aafc8; margin-top: 3px; }
.sb-ability p b { color: var(--text); }
.sb-locked-hint {
  font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 2px;
  color: var(--text-muted); text-align: center; margin-top: 16px; opacity: 0.6;
}
@media (max-width: 500px) {
  .sb-score-label { font-size: 0.58rem; letter-spacing: 1px; }
  .sb-score-val { font-size: 0.9rem; }
  .sb-name { font-size: 1.05rem; }
  .page-nav { flex-wrap: wrap; justify-content: center; }
}
@media (hover: none) { .nav-btn:active { color: var(--accent); } }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="wrapper">
  <nav class="page-nav">
    <a href="index.html" class="nav-btn">← Wyrmling Codex</a>
    <a href="Abyssal_Skill_Tree.html" class="nav-btn">Skill Tree →</a>
  </nav>

  <div class="dragon-header">
    <div class="eyebrow">⚫ Deep Sea Wyrmling</div>
    <h1>Abyssal Dragon</h1>
    <div class="subtitle">Stat Block — Current Form</div>
  </div>

  <div class="mastery-badge">
    <span class="count" id="masteryCount">0 / 21 Mastery</span>
    <div class="mastery-bar-bg"><div class="mastery-bar-fill" id="masteryFill" style="width:0%"></div></div>
  </div>

  <div class="statblock">
    <div class="sb-inner" id="sbInner"></div>
  </div>

  <div class="sb-locked-hint">Sblocca le mastery nella Skill Tree per potenziare il drago</div>
</div>

<script>
const SAVE_KEY = 'dragon_villis';
const TOTAL = 21;
const BASE = { STR: 10, DEX: 16, CON: 14, INT: 8, WIS: 10, CHA: 12 };
const PROF = 2;
const HD = 5;

const STAT_BONUSES = {
  p1s1: { stat: 'CON', bonus: 1 }, p1s2: { stat: 'CON', bonus: 1 }, p1s3: { stat: 'CON', bonus: 2 },
  p2s1: { stat: 'DEX', bonus: 1 }, p2s2: { stat: 'DEX', bonus: 1 }, p2s3: { stat: 'DEX', bonus: 2 },
  p3s1: { stat: 'CHA', bonus: 1 }, p3s2: { stat: 'CHA', bonus: 1 }, p3s3: { stat: 'CHA', bonus: 2 },
};

function getUnlocked() {
  try { const s = localStorage.getItem(SAVE_KEY); return new Set(s ? JSON.parse(s) : []); }
  catch(e) { return new Set(); }
}

function mod(v) { return Math.floor((v - 10) / 2); }
function modStr(v) { const m = mod(v); return (m >= 0 ? '+' : '') + m; }
function signed(n) { return (n >= 0 ? '+' : '') + n; }

function computeStats(unlocked) {
  const stats = { ...BASE };
  for (const [id, nb] of Object.entries(STAT_BONUSES)) {
    if (unlocked.has(id)) stats[nb.stat] += nb.bonus;
  }
  return stats;
}

function render() {
  const unlocked = getUnlocked();
  const stats = computeStats(unlocked);
  const count = unlocked.size;

  document.getElementById('masteryCount').textContent = count + ' / ' + TOTAL + ' Mastery';
  document.getElementById('masteryFill').style.width = (count / TOTAL * 100) + '%';

  const conMod = mod(stats.CON), dexMod = mod(stats.DEX);
  const strMod = mod(stats.STR), wisMod = mod(stats.WIS), chaMod = mod(stats.CHA);

  // HP: floor(5*4.5) = 22, formula 5d8
  const hpBonus = HD * conMod;
  const hpFormula = HD + 'd8' + (hpBonus > 0 ? '+' + hpBonus : hpBonus < 0 ? hpBonus : '');
  const hp = 22 + hpBonus;

  const breathDC = 8 + PROF + conMod;
  const auraDC = 8 + PROF + chaMod;

  let breathCone = '15 ft.', breathDmg = '3d8 cold';
  let breathRecharge = 'Recharge 5–6';
  if (unlocked.has('p1n1')) breathRecharge = 'Recharge 6';
  if (unlocked.has('p1n2')) { breathCone = '20 ft.'; breathDmg = '4d10 cold'; }

  let auraRange = '10 ft.';
  if (unlocked.has('p3cap')) auraRange = '20 ft.';

  const biteHit = signed(dexMod + PROF);
  const biteDmg = '1d6' + (dexMod >= 0 ? '+' : '') + dexMod + ' piercing';

  const resistances = [];
  if (unlocked.has('p1n1')) resistances.push('cold');

  // ── Build HTML ────────────────────────────────────────────────────────────

  let html = `
    <div class="sb-name">Abyssal Dragon Wyrmling</div>
    <div class="sb-type"><em>Small Dragon, Neutral</em></div>
    <div class="sb-divider"></div>
    <div class="sb-basics">
      <p><strong>Armor Class</strong> 13 (natural armor)</p>
      <p><strong>Hit Points</strong> ${hp} (${hpFormula})</p>
      <p><strong>Speed</strong> 30 ft., fly 60 ft., swim 60 ft.</p>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-scores">`;

  for (const k of ['STR','DEX','CON','INT','WIS','CHA']) {
    html += `<div class="sb-score-cell">
      <div class="sb-score-label">${k}</div>
      <div class="sb-score-val">${stats[k]}</div>
      <div class="sb-score-mod">${modStr(stats[k])}</div>
    </div>`;
  }

  html += `</div><div class="sb-divider"></div>`;
  html += `<p class="sb-prop"><strong>Saving Throws</strong> Dex ${signed(dexMod + PROF)}, Con ${signed(conMod + PROF)}</p>`;
  html += `<p class="sb-prop"><strong>Skills</strong> Perception ${signed(wisMod + PROF)}, Stealth ${signed(dexMod + PROF)}</p>`;
  if (resistances.length) html += `<p class="sb-prop"><strong>Damage Resistances</strong> ${resistances.join(', ')}</p>`;
  html += `<p class="sb-prop"><strong>Senses</strong> Blindsight 10 ft., Darkvision 60 ft., Passive Perception ${10 + wisMod + PROF}</p>`;
  html += `<p class="sb-prop"><strong>Languages</strong> Draconic</p>`;
  html += `<p class="sb-prop"><strong>Challenge</strong> 2 (450 XP) &nbsp;·&nbsp; <strong>Proficiency Bonus</strong> +${PROF}</p>`;
  html += `<div class="sb-divider"></div>`;

  // ── Traits ────────────────────────────────────────────────────────────────

  // Pressure Aura (always present, masteries enhance it)
  let auraDesc = `The dragon exudes crushing pressure in a <b>${auraRange} radius</b>.`;
  if (!unlocked.has('p3n2')) {
    auraDesc += ' Creatures within treat the area as <b>difficult terrain</b>.';
  } else {
    auraDesc += ' Hostile creatures that start their turn in the aura have their <b>speed halved</b> and have <b>disadvantage</b> on STR and DEX saving throws until the end of their next turn.';
  }
  if (unlocked.has('p3n1')) {
    auraDesc += ` Hostile creatures that start their turn in the aura must also succeed on a <b>WIS save (DC ${auraDC})</b> or be <b>frightened</b> until the end of that turn.`;
  }
  if (unlocked.has('p3cap')) {
    const xDice = Math.max(1, Math.floor(count / 7));
    auraDesc += ` Creatures that start their turn in the aura take <b>${xDice}d12 force damage</b>.`;
  }
  html += `<div class="sb-ability"><span class="sb-ability-name">Pressure Aura.</span><p>${auraDesc}</p></div>`;

  if (unlocked.has('p2n3')) {
    html += `<div class="sb-ability"><span class="sb-ability-name">Blood Frenzy.</span>
      <p>When the dragon reduces a creature to <b>0 HP</b>, it may immediately make one additional attack as a <b>free action</b>. This effect can trigger once per turn.</p></div>`;
  }

  if (unlocked.has('p2cap')) {
    html += `<div class="sb-ability"><span class="sb-ability-name">Apex Predator.</span>
      <p>Whenever the dragon reduces a creature to <b>30 HP or fewer</b> with a melee attack, it can attempt to instantly kill the target. The target must succeed on a <b>CON save (DC ${8 + PROF + strMod})</b> or die.</p></div>`;
  }

  html += `<div class="sb-divider"></div>`;

  // ── Actions ───────────────────────────────────────────────────────────────
  html += `<div class="sb-section-title">Actions</div>`;

  if (unlocked.has('p2n1')) {
    html += `<div class="sb-ability"><span class="sb-ability-name">Multiattack.</span>
      <p>The dragon makes two attacks: one with its <b>Bite</b> and one with its <b>Claws</b>.</p></div>`;
  }

  html += `<div class="sb-ability">
    <span class="sb-ability-name">Bite. <span class="tag">Melee Weapon Attack:</span></span>
    <p>${biteHit} to hit, reach 5 ft., one target. <b>Hit:</b> ${biteDmg}.</p>
  </div>`;

  if (unlocked.has('p2n1')) {
    const clawDmg = '1d4' + (dexMod >= 0 ? '+' : '') + dexMod + ' slashing';
    html += `<div class="sb-ability">
      <span class="sb-ability-name">Claws. <span class="tag">Melee Weapon Attack:</span></span>
      <p>${biteHit} to hit, reach 5 ft., one target. <b>Hit:</b> ${clawDmg}.</p>
    </div>`;
  }

  if (unlocked.has('p2n2')) {
    const tailDmg = '2d6' + (dexMod >= 0 ? '+' : '') + dexMod + ' bludgeoning';
    html += `<div class="sb-ability">
      <span class="sb-ability-name">Tail Sweep. <span class="tag">Melee Weapon Attack:</span></span>
      <p>The dragon sweeps its tail behind it in a wide arc. All creatures in that area must make a <b>DEX save (DC ${8 + PROF + dexMod})</b>. On a failure, they take <b>${tailDmg}</b> and are knocked <b>prone</b>. On a success, half damage only.</p>
    </div>`;
  }

  let breathExtra = '';
  if (unlocked.has('p1n3')) {
    breathExtra = ' On a failed save, the creature is also <b>slowed</b> (speed halved, −2 AC and DEX saves, no reactions) until the end of its next turn.';
  }
  html += `<div class="sb-ability">
    <span class="sb-ability-name">Cold Breath <span class="tag">(${breathRecharge}).</span></span>
    <p>The dragon exhales a ${breathCone} cone of freezing black water. Each creature in the area must make a <b>CON save (DC ${breathDC})</b>. On a failure, a creature takes <b>${breathDmg}</b> damage; half as much on a success.${breathExtra}</p>
  </div>`;

  if (unlocked.has('p3n3')) {
    html += `<div class="sb-ability">
      <span class="sb-ability-name">Void Gaze <span class="tag">(1/Short Rest).</span></span>
      <p>The dragon fixes its unblinking gaze on one creature within <b>30 ft.</b> The target must succeed on a <b>WIS save (DC ${auraDC})</b> or be <b>paralyzed</b> until the end of its next turn.</p>
    </div>`;
  }

  if (unlocked.has('p1cap')) {
    html += `<div class="sb-ability">
      <span class="sb-ability-name">Leviathan's Wrath <span class="tag">(1/Long Rest).</span></span>
      <p>The dragon unleashes a torrent of abyssal water in a <b>30 ft. cone</b>. Each creature must make a <b>STR save (DC ${breathDC})</b>. On a failure, they are pushed <b>15 ft.</b>, knocked <b>prone</b>, and take <b>6d10 cold damage</b> (half on success). Creatures pushed into a wall or solid object take an additional <b>2d10 bludgeoning</b> damage.</p>
    </div>`;
  }

  html += `<div class="sb-divider-thin"></div>`;

  document.getElementById('sbInner').innerHTML = html;
}

render();
window.addEventListener('pageshow', e => { if (e.persisted) render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });

(function() {
  const cont = document.getElementById('particles');
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random() * 2 + 0.5;
    const a = Math.random() * 0.28 + 0.05;
    p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;background:rgba(0,200,215,${a});animation-duration:${Math.random()*22+10}s;animation-delay:${Math.random()*22}s;`;
    cont.appendChild(p);
  }
})();
</script>
</body>
</html>

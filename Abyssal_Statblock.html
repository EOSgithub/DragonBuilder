<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abyssal Dragon — Stat Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="codex.css">
<script src="codex-sync.js"></script>
<script src="codex.js"></script>
</head>
<body data-dragon="abyssal" data-page="statblock">

<main class="shell">

  <nav class="topnav">
    <a href="index.html" class="btn btn--ghost"><span class="arrow" style="transform:rotate(180deg)">→</span> Codex</a>
    <a href="Abyssal_Skill_Tree.html" class="btn btn--ghost">Skill Tree <span class="arrow">→</span></a>
  </nav>

  <header class="plate-head reveal r1">
    <span class="sigil" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M8 15 Q24 25 40 15" opacity=".95"/>
        <path d="M13 23 Q24 30 35 23" opacity=".7"/>
        <path d="M18 31 Q24 35 30 31" opacity=".5"/>
        <line x1="24" y1="5" x2="24" y2="39" stroke-dasharray="1 3"/>
        <path d="M24 41 l-3.2 -5.5 h6.4 z" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <div class="binom">Draco abyssalis</div>
    <h1>Abyssal Dragon</h1>
    <div class="stage-line" id="stageLine">⚫ Abyssal Wyrmling</div>
  </header>

  <div class="plate-mastery reveal r2">
    <span class="count" id="masteryCount">0 / 21 Mastery</span>
    <div class="spec-track"><div class="spec-track-fill" id="masteryFill"></div></div>
  </div>

  <article class="plate reveal r2">
    <div class="plate-rule"></div>
    <div class="plate-inner" id="sbInner"></div>
    <div class="plate-rule"></div>
  </article>

  <p class="sb-locked-hint reveal r3">Tocca un&rsquo;abilit&agrave; per tirarne i dadi &middot; Sblocca mastery nello Skill Tree per potenziare il drago</p>

</main>

<script>
const SAVE_KEY = 'dragon_villis';
const TOTAL = 21;
const BASE = { STR: 10, DEX: 16, CON: 14, INT: 8, WIS: 12, CHA: 10 };
// Proficiency bonus by size/stage: Tiny 2, Small 3, Medium 3, Large 4, larger 5
const PROF_BY_STAGE = [2, 3, 3, 4, 5];
// HP tracks the bonded Oathsworn's character level. Final: 14.
const OATHSWORN_LEVEL = 14;

const STAGES = [
  { name: 'Wyrmling', size: 'Tiny',  hpMult: 10, eyebrow: '⚫ Abyssal Wyrmling', blindsight: '10 ft.'  },
  { name: 'Whelp',   size: 'Small',  hpMult: 15, eyebrow: '⚫ Abyssal Whelp',    blindsight: '30 ft.'  },
  { name: 'Young',   size: 'Medium', hpMult: 20, eyebrow: '⚫ Abyssal Young',    blindsight: '60 ft.'  },
  { name: 'Adult',   size: 'Large',  hpMult: 25, eyebrow: '⚫ Abyssal Adult',    blindsight: '90 ft.'  },
];
// Speed by stage — Tiny, Small, Medium, Large. Walk climbs by 5 a stage, the
// dragon's own mode by 10, so growing larger is felt on the grid.
const SPEED_BY_STAGE = [
  { walk: 20, swim: 40 },
  { walk: 25, swim: 50 },
  { walk: 30, swim: 60 },
  { walk: 35, swim: 70 },
];
function speedLine(idx) {
  const s = SPEED_BY_STAGE[idx];
  return s.walk + ' ft., swim ' + s.swim + ' ft.';
}

function getStageIdx(n) { if (n >= 20) return 3; if (n >= 10) return 2; if (n >= 5) return 1; return 0; }

const STAT_BONUSES = {
  p1s1: { stat: 'CON', bonus: 1 }, p1s2: { stat: 'CON', bonus: 1 }, p1s3: { stat: 'CON', bonus: 2 },
  p2s1: { stat: 'DEX', bonus: 1 }, p2s2: { stat: 'DEX', bonus: 1 }, p2s3: { stat: 'DEX', bonus: 2 },
  p3s1: { stat: 'CHA', bonus: 1 }, p3s2: { stat: 'CHA', bonus: 1 }, p3s3: { stat: 'CHA', bonus: 2 },
};

function getUnlocked() {
  try { const s = localStorage.getItem(SAVE_KEY); return new Set(s ? JSON.parse(s) : []); }
  catch(e) { return new Set(); }
}
function mod(v) { return Math.floor((v - 10) / 2); }
function modStr(v) { const m = mod(v); return (m >= 0 ? '+' : '') + m; }
function signed(n) { return (n >= 0 ? '+' : '') + n; }
// Damage expression: the modifier is omitted entirely when it is 0, so we never
// print "2d6+0". Kept ASCII-signed so codex.js can parse and roll it.
function dmgStr(dice, m, type) { return dice + (m > 0 ? '+' + m : m < 0 ? '-' + Math.abs(m) : '') + ' ' + type; }

function computeStats(unlocked) {
  const stats = { ...BASE };
  for (const [id, nb] of Object.entries(STAT_BONUSES)) if (unlocked.has(id)) stats[nb.stat] += nb.bonus;
  return stats;
}

function render() {
  const unlocked = getUnlocked();
  const stats = computeStats(unlocked);
  const count = unlocked.size;

  document.getElementById('masteryCount').textContent = count + ' / ' + TOTAL + ' Mastery';
  document.getElementById('masteryFill').style.width = (count / TOTAL * 100) + '%';

  const conMod = mod(stats.CON), dexMod = mod(stats.DEX), strMod = mod(stats.STR), wisMod = mod(stats.WIS), chaMod = mod(stats.CHA);
  const stageIdx = getStageIdx(count);
  const stage = STAGES[stageIdx];
  const PROF = PROF_BY_STAGE[stageIdx];
  const hp = conMod * stage.hpMult + OATHSWORN_LEVEL * 2;
  document.getElementById('stageLine').textContent = stage.eyebrow;

  const ac = 13 + dexMod;
  const breathDC = 8 + PROF + conMod; // Breath path (p1 · CON)
  // Charisma sets the DC for every mind-affecting effect — the Pressure Aura's
  // fear and Luring Light's charm alike — as 2024 keys those to CHA.
  const chaDC    = 8 + PROF + chaMod;

  let breathRecharge = '1/Short Rest', breathCone = '15 ft.', breathDmg = '3d10 cold';
  if (unlocked.has('p1n1')) breathRecharge = 'Recharge 6';
  if (unlocked.has('p1n2')) { breathCone = '20 ft.'; breathDmg = '4d10 cold'; }
  // Pressure Aura radius scales with the Aura path (Deep Terror → Crushing Pressure → Abyssal Incarnation)
  let auraRange = '5 ft.';
  if (unlocked.has('p3n1'))  auraRange = '10 ft.';
  if (unlocked.has('p3n2'))  auraRange = '15 ft.';
  if (unlocked.has('p3cap')) auraRange = '20 ft.';
  const rendHit = signed(dexMod + PROF);
  const rendDmg = dmgStr('2d6', dexMod, 'slashing');

  let html = `
    <div class="sb-name">Abyssal Dragon ${stage.name} — Villis</div>
    <div class="sb-type"><em>${stage.size} Dragon, Neutral</em></div>
    <div class="sb-divider"></div>
    <div class="sb-basics">
      <p><span class="sb-label">Armor Class</span> ${ac} (13 + DEX mod.)</p>
      <p><span class="sb-label">Hit Points</span> ${hp} (${stage.hpMult} × CON mod. + Level ${OATHSWORN_LEVEL} × 2)</p>
      <p><span class="sb-label">Speed</span> ${speedLine(stageIdx)}</p>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-scores">`;

  for (const k of ['STR','DEX','CON','INT','WIS','CHA']) {
    html += `<div class="sb-score-cell"><div class="sb-score-k">${k}</div><div class="sb-score-v">${stats[k]}</div><div class="sb-score-m">${modStr(stats[k])}</div></div>`;
  }
  html += `</div><div class="sb-divider"></div>`;
  html += `<p class="sb-prop"><span class="sb-label">Saving Throws</span> Dex ${signed(dexMod + PROF)}, Con ${signed(conMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Skills</span> Perception ${signed(wisMod + PROF)}, Stealth ${signed(dexMod + PROF)}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Damage Resistances</span> bludgeoning (Pressure Aura)`;
  if (unlocked.has('p1n1')) html += ', cold';
  html += `</p>`;
  const blindsight = stageIdx >= 3 ? `Blindsight 90 ft., Truesight 30 ft.` : `Blindsight ${stage.blindsight}`;
  html += `<p class="sb-prop"><span class="sb-label">Senses</span> ${blindsight}, Darkvision 60 ft., Passive Perception ${10 + wisMod + PROF}</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Languages</span> Draconic</p>`;
  html += `<p class="sb-prop"><span class="sb-label">Challenge</span> — &nbsp;·&nbsp; <span class="sb-label">Proficiency Bonus</span> +${PROF}</p>`;
  html += `<div class="sb-divider"></div>`;

  // Traits
  let auraEffects = ['The area within the aura is considered <b>difficult terrain</b> for hostile creatures.'];
  if (unlocked.has('p3n1')) auraEffects.push(`<b>Deep Terror.</b> Hostile creatures that start their turn within the aura — or that enter it — must succeed on a <b>WIS save (DC ${chaDC})</b> or be <b>frightened</b> of the dragon until the end of that turn.`);
  if (unlocked.has('p3n2')) auraEffects.push('<b>Crushing Pressure.</b> Creatures that start their turn within the aura have their <b>speed halved</b> until the end of their turn.');
  if (unlocked.has('p3cap')) auraEffects.push('<b>Abyssal Incarnation.</b> Creatures that start their turn in the aura take <b>2d8 force damage</b>, increasing by an additional 2d8 for each consecutive round they remain within it.');
  html += `<div class="sb-ability"><span class="sb-ability-name">Pressure Aura.</span>
    <p>The dragon exudes crushing abyssal pressure in a <b>${auraRange} radius</b>. It gains <b>resistance to bludgeoning damage</b>. ${auraEffects.join(' ')}</p></div>`;

  if (stageIdx >= 1) {
    const coldDice = ['', '1d6', '2d6', '4d6'][stageIdx];
    let vbText = `The dragon's senses pierce the deep dark. Its blindsight extends to <b>${stage.blindsight}</b> It is <b>immune to the frightened condition</b>. Creatures that hit it with a melee attack take <b>${coldDice} cold damage</b> from the void chill radiating off its scales.`;
    if (stageIdx >= 2) vbText += ` The dragon is also <b>immune to the charmed condition</b> and can breathe water freely.`;
    if (stageIdx >= 3) vbText += ` The dragon is <b>immune to psychic damage</b>, can see through magical darkness, and its cold damage <b>ignores resistance</b>.`;
    html += `<div class="sb-ability"><span class="sb-ability-name">Void-Born <span class="tag">(${stage.name}).</span></span><p>${vbText}</p></div>`;
  }

  if (unlocked.has('p2n3')) html += `<div class="sb-ability"><span class="sb-ability-name">Blood Frenzy.</span><p>Creatures damaged by the dragon's <b>Rend</b> attack gain <b>1 stack of [Bleeding]</b>. The dragon has <b>advantage on attack rolls</b> against creatures that are [Bleeding].</p></div>`;
  if (unlocked.has('p3n3')) html += `<div class="sb-ability"><span class="sb-ability-name">Predation.</span><p>When the dragon or its Oathsworn hits a creature within the Pressure Aura that is <b>charmed</b> or <b>frightened</b>, it can choose to <b>end that condition</b> and turn the attack into a <b>critical hit</b>.</p></div>`;
  if (unlocked.has('p2cap')) html += `<div class="sb-ability"><span class="sb-ability-name">Apex Predator.</span><p>Whenever the dragon reduces a creature to <b>30 HP or fewer</b> with a melee attack, it can choose to <b>instantly kill</b> the target and immediately make one additional attack as a <b>free action</b>.</p></div>`;

  html += `<div class="sb-divider"></div><div class="sb-section-title">Actions</div>`;

  if (unlocked.has('p2n1')) html += `<div class="sb-ability"><span class="sb-ability-name">Multiattack.</span><p>The dragon makes <b>two Rend attacks</b>, or <b>one Rend and one Luring Light</b> attack.</p></div>`;

  html += `<div class="sb-ability"><span class="sb-ability-name">Rend. <span class="tag">Melee Weapon Attack:</span></span>
    <p>${rendHit} to hit, reach 5 ft., one target. <b>Hit:</b> ${rendDmg}.</p></div>`;

  if (unlocked.has('p2n2')) {
    html += `<div class="sb-ability"><span class="sb-ability-name">Luring Light.</span>
      <p>A glowing light draws prey in. A creature within <b>30 ft.</b> must succeed on a <b>WIS save (DC ${chaDC})</b> or be <b>charmed</b> and use its reaction to move toward the dragon. If it ends this movement within <b>5 ft.</b> of the dragon, the dragon can make one free <b>Rend</b> attack against it.</p></div>`;
  }

  let breathExtra = ' A creature that fails also <b>cannot speak</b> until the end of its next turn, as the cold steals the breath from its lungs.';
  if (unlocked.has('p1n3')) breathExtra += ' It is also <b>slowed</b> (speed halved, −2 AC and DEX saves, no reactions) until the end of its next turn.';
  html += `<div class="sb-ability"><span class="sb-ability-name">Hadal Breath <span class="tag">(${breathRecharge}).</span></span>
    <p>The dragon exhales a ${breathCone} cone of freezing abyssal water. Each creature in the area must make a <b>CON save (DC ${breathDC})</b>. On a failure, a creature takes <b>${breathDmg}</b> damage; half as much on a success.${breathExtra}</p></div>`;

  if (unlocked.has('p1cap')) html += `<div class="sb-ability"><span class="sb-ability-name">Leviathan's Wrath <span class="tag">(1/Long Rest).</span></span>
    <p>The dragon unleashes a torrent of black abyssal water in a <b>30 ft. cone</b>. Each creature in the area must make a <b>STR save (DC ${breathDC})</b> or be <b>pushed or pulled 30 ft.</b> and take <b>6d10 cold damage</b> (half as much damage on a success).</p></div>`;

  document.getElementById('sbInner').innerHTML = html;
  if (window.Codex) Codex.enhance();
}

// ── GITHUB AUTO-LOAD ─────────────────────────────────────────────────────────
/* The shared layer owns the round-trip, so this page inherits the no-store read
   that keeps a cached response from passing for a fresh one. */
const DRAGON = document.body.dataset.dragon;

render();
Sync.initReadOnly({ dragons: [DRAGON], onLoaded: render });

window.addEventListener('pageshow', e => { if (e.persisted) render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  render();
  if (Sync.configured()) Sync.fetchAll([DRAGON]).then(render);
});
</script>
</body>
</html>
